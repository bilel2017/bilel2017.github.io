      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 20%, rgba(94,234,212,.13), transparent 30%),
          radial-gradient(circle at 80% 75%, rgba(127,208,160,.12), transparent 28%);
        animation: ambient 7s ease-in-out infinite alternate;
        z-index: 0;
      }

      #brand {
        position: relative;
        z-index: 5;
        text-align: center;
        padding: 14px 10px 12px;
        background: rgba(5, 9, 13, .78);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 8px 30px rgba(0,0,0,.25);
        backdrop-filter: blur(10px);
      }

      #brand img {
        width: 42px;
        height: 42px;
        margin-right: 10px;
        border-radius: 12px;
        vertical-align: middle;
        object-fit: cover;
        box-shadow: 0 0 22px rgba(127,208,160,.22);
      }

      #brand b {
        font-size: clamp(17px, 4vw, 22px);
        font-weight: 800;
        letter-spacing: .16em;
        color: #f5faf8;
        vertical-align: middle;
        text-shadow: 0 0 18px rgba(127,208,160,.25);
      }

      #brand::after {
        content: "PS4 HOST • SYSTEM READY • 0561 65 17 10";
        display: block;
        margin-top: 5px;
        color: #9fb3ad;
        font-size: 10px;
        letter-spacing: .18em;
      }

      #spin {
        position: fixed;
        z-index: 4;
        top: calc(50% + 20px);
        left: 50%;
        width: 58px;
        height: 58px;
        margin: -29px 0 0 -29px;
        border: 4px solid rgba(255,255,255,.10);
        border-top-color: var(--accent);
        border-right-color: var(--accent2);
        border-radius: 50%;
        animation: spin .85s linear infinite, glow 1.5s ease-in-out infinite alternate;
        box-shadow: 0 0 30px rgba(127,208,160,.18);
      }

      #spin::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(127,208,160,.25);
        border-radius: 50%;
      }

      #msg {
        position: fixed;
        z-index: 4;
        top: 50%;
        left: 16px;
        right: 16px;
        transform: translateY(-50%);
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #f0f7f4;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 18px 60px rgba(0,0,0,.38);
        display: none;
      }

      #wrap {
        position: relative;
        z-index: 2;
        padding: 0;
      }

      #state, #out { display: none; }

      body.done #spin { display: none; }

      body.fail #spin { display: none; }

      body.fail #msg { display: block; }

      body.log #spin, body.log #msg { display: none; }

      body.log #wrap {
        padding: 16px;
      }

      body.log #state {
        display: block;
        max-width: 1100px;
        margin: 0 auto 10px;
        padding: 14px 16px;
        font-size: 21px;
        font-weight: 800;
        background: rgba(5, 9, 13, .82);
        border: 1px solid var(--border);
        border-radius: 14px;
        backdrop-filter: blur(10px);
      }

      body.log #out {
        display: block;
        max-width: 1100px;
        margin: auto;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        color: #d9e5df;
        background: rgba(7, 11, 16, .88);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        height: calc(100vh - 155px);
        overflow-y: auto;
        box-shadow: 0 16px 50px rgba(0,0,0,.30);
      }

      .ok, .safe { color: var(--accent); }
      .bad, .danger { color: #d08a7f; }
      .warn { color: #d8c07f; }
      code { color: #9fb3d0; }

      @keyframes spin { to { transform: rotate(360deg); } }

      @keyframes glow {
        from { filter: drop-shadow(0 0 3px rgba(127,208,160,.2)); }
        to { filter: drop-shadow(0 0 14px rgba(94,234,212,.55)); }
      }

      @keyframes ambient {
        from { opacity: .65; transform: scale(1); }
        to { opacity: 1; transform: scale(1.035); }
      }

      @media (max-width: 600px) {
        #brand { padding: 12px 8px 10px; }
        #brand img { width: 36px; height: 36px; }
        #brand::after { font-size: 8px; letter-spacing: .12em; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
